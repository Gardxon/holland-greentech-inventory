<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HGT Stock &amp; Sales System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#FAF9F3;
    --surface:#FFFFFF;
    --surface-2:#F1EFE4;
    --ink:#1B2420;
    --ink-soft:#586257;
    --ink-faint:#8A9188;
    --line:#E1DDCE;
    --line-strong:#CBC6B2;
    --accent:#3A6B4F;
    --accent-ink:#FFFFFF;
    --accent-soft:#E4EEE6;
    --accent-2:#8A6D3B;
    --warn:#9C6A0A;
    --warn-soft:#FBF0DC;
    --critical:#A63B2E;
    --critical-soft:#FBE7E1;
    --focus:#2F6FED;
    --shadow: 0 1px 2px rgba(27,36,32,.06), 0 6px 20px -8px rgba(27,36,32,.18);
    --radius: 10px;
    --font-display:'Fraunces', ui-serif, Georgia, serif;
    --font-body:'Public Sans', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#11150F;
      --surface:#171C15;
      --surface-2:#1E2419;
      --ink:#E9EEE5;
      --ink-soft:#A8B1A2;
      --ink-faint:#707A6C;
      --line:#2A3225;
      --line-strong:#3B4634;
      --accent:#7BC69C;
      --accent-ink:#0D1A11;
      --accent-soft:#1E2E22;
      --accent-2:#D8B876;
      --warn:#E4AC49;
      --warn-soft:#332711;
      --critical:#E8897B;
      --critical-soft:#382019;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#11150F;
    --surface:#171C15;
    --surface-2:#1E2419;
    --ink:#E9EEE5;
    --ink-soft:#A8B1A2;
    --ink-faint:#707A6C;
    --line:#2A3225;
    --line-strong:#3B4634;
    --accent:#7BC69C;
    --accent-ink:#0D1A11;
    --accent-soft:#1E2E22;
    --accent-2:#D8B876;
    --warn:#E4AC49;
    --warn-soft:#332711;
    --critical:#E8897B;
    --critical-soft:#382019;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.55);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:14.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; color:var(--ink); }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .mono{ font-family:var(--font-mono); }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
  ::selection{ background:var(--accent-soft); }

  /* ---------- layout shell ---------- */
  #shell{ display:flex; min-height:100vh; }
  #sidebar{
    width:228px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 18px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:#0A0A0A; color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1.1; }
  .brand-sub{ font-size:11px; color:var(--ink-faint); letter-spacing:.02em; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:8px;
    color:var(--ink-soft); text-decoration:none; font-size:13.5px; font-weight:500; cursor:pointer;
    border:1px solid transparent; background:none; text-align:left; width:100%;
  }
  .nav-item svg{ flex:none; opacity:.85; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item.active svg{ opacity:1; }
  .nav-sep{ height:1px; background:var(--line); margin:10px 4px; }
  .nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding:12px 11px 4px; }

  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid var(--line);
    background:var(--paper); position:sticky; top:0; z-index:5;
  }
  #menuBtn{ display:none; }
  #topbar .spacer{ flex:1; }
  .topbar-date{ color:var(--ink-faint); font-size:12.5px; }
  .member-chip{
    display:flex; align-items:center; gap:8px; padding:5px 6px 5px 6px; border-radius:99px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer; position:relative;
  }
  .member-avatar{
    width:26px; height:26px; border-radius:99px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none;
  }
  .member-chip-name{ font-size:13px; font-weight:600; padding-right:2px; }
  .member-chip-role{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:-2px; }
  .member-menu{
    position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow); min-width:170px; padding:6px; display:none; z-index:20;
  }
  .member-menu.open{ display:block; }
  .member-menu button{
    display:block; width:100%; text-align:left; padding:8px 10px; border-radius:6px; border:none;
    background:none; color:var(--ink); font-size:13px; cursor:pointer;
  }
  .member-menu button:hover{ background:var(--surface-2); }

  #app{ flex:1; padding:24px 26px 60px; max-width:1180px; width:100%; margin:0 auto; }

  /* ---------- primitives ---------- */
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .page-title{ font-size:23px; }
  .page-sub{ color:var(--ink-soft); font-size:13px; margin-top:3px; }
  .btn{
    display:inline-flex; align-items:center; gap:7px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:600; padding:9px 14px;
    cursor:pointer; line-height:1.1; white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ background:var(--critical-soft); border-color:var(--critical-soft); color:var(--critical); }
  .btn.ghost{ background:none; border-color:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn.small{ padding:6px 10px; font-size:12.5px; }
  .btn.block{ width:100%; justify-content:center; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }
  .error-text{ font-size:12px; color:var(--critical); margin-top:4px; }
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:64px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:160px; }
  fieldset{ border:none; padding:0; margin:0; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .card + .card{ margin-top:14px; }
  .grid{ display:grid; gap:14px; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .stat-label{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  .stat-value{ font-family:var(--font-display); font-size:28px; font-weight:600; margin-top:6px; }
  .stat-value.critical{ color:var(--critical); }
  .stat-value.warn{ color:var(--warn); }
  .stat-foot{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .section-title{ font-size:15px; font-weight:700; margin:26px 0 10px; font-family:var(--font-display); }
  .section-title:first-child{ margin-top:0; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
    padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600;
  }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
  .table-wrap table{ min-width:640px; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
  .pill.ok{ background:var(--accent-soft); color:var(--accent); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.critical{ background:var(--critical-soft); color:var(--critical); }
  .pill.neutral{ background:var(--surface-2); color:var(--ink-soft); }
  .pill.admin{ background:var(--accent-2); color:#fff; }

  .empty{ text-align:center; padding:44px 20px; color:var(--ink-faint); }
  .empty svg{ opacity:.5; margin-bottom:10px; }

  /* combobox */
  .combo{ position:relative; }
  .combo-list{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; box-shadow:var(--shadow); max-height:260px; overflow-y:auto; z-index:15; display:none;
  }
  .combo-list.open{ display:block; }
  .combo-opt{ padding:8px 11px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .combo-opt:hover, .combo-opt.hi{ background:var(--accent-soft); }
  .combo-opt .p-name{ color:var(--ink); }
  .combo-opt .p-meta{ color:var(--ink-faint); font-size:11.5px; white-space:nowrap; }

  /* login / onboarding */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
    radial-gradient(1100px 500px at 20% -10%, var(--accent-soft), transparent 60%), var(--paper); }
  .auth-card{ width:100%; max-width:400px; }
  .auth-brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .auth-brand .brand-mark{ width:44px; height:44px; border-radius:12px; }
  .auth-brand h1{ font-size:21px; }
  .member-pick{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .member-pick button{
    display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer; text-align:left; font-size:14px; color:var(--ink);
  }
  .member-pick button:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin:22px 0; }
  .pin-dot{ width:15px; height:15px; border-radius:99px; border:2px solid var(--line-strong); }
  .pin-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto; }
  .pin-pad button{
    padding:14px 0; font-size:18px; font-weight:600; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer; color:var(--ink); font-family:var(--font-mono);
  }
  .pin-pad button:hover{ background:var(--surface-2); }
  .pin-pad button.wide{ font-size:12px; font-weight:600; font-family:var(--font-body); color:var(--ink-soft); }

  /* modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,18,13,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--surface); border-radius:12px; border:1px solid var(--line); box-shadow:var(--shadow); width:100%; max-width:420px; padding:20px; }
  .modal h3{ font-size:17px; margin-bottom:8px; }
  .modal p{ color:var(--ink-soft); font-size:13.5px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  /* toast */
  #toastWrap{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); }
  .toast.err{ background:var(--critical); color:#fff; }
  .toast.ok{ background:var(--accent); color:var(--accent-ink); }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .tab{ padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--accent); border-color:var(--accent); }

  .search-input{ position:relative; }
  .search-input svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  .search-input input{ padding-left:32px; }

  @media (max-width:900px){
    #sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .18s ease; box-shadow:var(--shadow); }
    #sidebar.open{ transform:translateX(0); }
    #menuBtn{ display:flex; }
    #app{ padding:18px 16px 50px; }
    .sidebar-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35; display:none; }
    .sidebar-scrim.open{ display:block; }
  }
  @media (max-width:640px){
    thead{ display:none; }
    .table-wrap.stack table, .table-wrap.stack tbody, .table-wrap.stack tr, .table-wrap.stack td{ display:block; width:100%; }
    .table-wrap.stack tr{ padding:10px 12px; border-bottom:1px solid var(--line); }
    .table-wrap.stack td{ border:none; padding:3px 0; display:flex; justify-content:space-between; gap:10px; }
    .table-wrap.stack td::before{ content:attr(data-label); color:var(--ink-faint); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  }
  [hidden]{ display:none !important; }
</style>

<div id="app-root"></div>
<div id="toastWrap"></div>

/* ===================== tiny utils ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US'); }
function fmtTZS(n){ n = Number(n)||0; return 'TSh ' + Math.round(n).toLocaleString('en-US'); }
function todayISO(){ const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function initials(name){ return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function packLabel(p){ const ps = p && p.packSize; if(ps===0) return 'each'; if(typeof ps==='number' && isFinite(ps)) return fmt(ps)+'g'; const s = String(ps==null?'':ps).trim(); return s || '—'; }
function toast(msg, kind){ const t=el(`<div class="toast ${kind||''}">${esc(msg)}</div>`); document.getElementById('toastWrap').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(),260); },2600); }
function csvEscape(v){ v = v==null?'':String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCSV(rows){ return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'); }

const bus = new EventTarget();
function emitData(){ bus.dispatchEvent(new Event('data')); }
function emitAuth(){ bus.dispatchEvent(new Event('auth')); }

function regroupMovements(){
  const map = new Map();
  for(const m of STATE.movements){
    if(!map.has(m.productId)) map.set(m.productId, []);
    map.get(m.productId).push(m);
  }
  STATE.movementsByProduct = map;
}

function computeStock(product){
  const arushaBase = product.baselineArusha||0, moroBase = product.baselineMoro||0;
  let arusha = arushaBase, moro = moroBase;
  const branch = {};
  BRANCHES.forEach(b=>{
    const bb = (product.baselineBranch && product.baselineBranch[b]) || {};
    branch[b] = {sent:bb.sent||0, sold:bb.sold||0, notSold:bb.notSold||0, returned:bb.returned||0};
  });
  const list = STATE.movementsByProduct.get(product.id) || [];
  for(const m of list){
    if(product.baselineDate && m.date < product.baselineDate) continue;
    if(m.type==='stock_in'){ if(m.warehouse==='Arusha') arusha+=m.quantity; else if(m.warehouse==='Moro') moro+=m.quantity; }
    else if(m.type==='stock_out'){ if(m.warehouse==='Arusha') arusha-=m.quantity; else if(m.warehouse==='Moro') moro-=m.quantity; }
    else if(m.type==='sale'){
      if(m.warehouse==='Arusha') arusha-=m.quantity;
      else if(m.warehouse==='Moro') moro-=m.quantity;
      else if(m.branch && branch[m.branch]) branch[m.branch].sold += m.quantity;
    }
    else if(m.type==='send_branch'){
      if(m.warehouse==='Arusha') arusha-=m.quantity; else if(m.warehouse==='Moro') moro-=m.quantity;
      if(branch[m.branch]) branch[m.branch].sent += m.quantity;
    }
    else if(m.type==='return_branch'){
      if(branch[m.branch]) branch[m.branch].returned += m.quantity;
      if(m.warehouse==='Arusha') arusha+=m.quantity; else if(m.warehouse==='Moro') moro+=m.quantity;
    }
    else if(m.type==='branch_result'){
      if(branch[m.branch]){ branch[m.branch].sold += (m.soldQty||0); branch[m.branch].notSold += (m.notSoldQty||0); }
    }
  }
  let branchOnHandTotal = 0;
  BRANCHES.forEach(b=>{ branch[b].onHand = branch[b].sent - branch[b].sold - branch[b].notSold - branch[b].returned; branchOnHandTotal += branch[b].onHand; });
  const total = arusha+moro;
  const companyTotal = total + branchOnHandTotal;
  let status = 'ok';
  if(total<=0) status='critical';
  else if(product.reorderPoint!=null && total<=product.reorderPoint) status='warn';
  return {arusha,moro,total,branch,branchOnHandTotal,companyTotal,status};
}

/* ===================== db bootstrap ===================== */
async function boot(){
  renderShell();
  try{
    STATE.db = await window.claude.use('db');
  }catch(e){ STATE.db = null; }
  try{
    STATE.downloads = await window.claude.use('downloads');
  }catch(e){ STATE.downloads = null; }

  if(!STATE.db){
    document.getElementById('app-root').innerHTML = `<div class="auth-wrap"><div class="auth-card card">
      <h1 style="margin-bottom:8px;">Can't connect to storage</h1>
      <p class="page-sub">This page needs the shared database to load your team, products and stock. Try reopening it — if this keeps happening, it may not be available in this view.</p>
    </div></div>`;
    return;
  }

  STATE.db.doc('app/config').onSnapshot(snap=>{
    if(snap.exists){ STATE.appConfig = Object.assign({businessName:'Holland Greentech'}, snap.data()); }
    document.title = STATE.appConfig.businessName || 'Holland Greentech';
    const bn = document.getElementById('brandName'); if(bn) bn.textContent = STATE.appConfig.businessName || 'Holland Greentech';
    emitData();
  }, ()=>{});

  let firstMembers = true;
  STATE.db.collection('members').onSnapshot(snap=>{
    STATE.members = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(firstMembers){
      firstMembers = false;
      restoreSession();
    }
    emitAuth(); emitData();
  }, err=>{ toast('Could not load team list: '+err.message,'err'); });

  STATE.db.collection('products').onSnapshot(snap=>{
    STATE.products = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=> a.product.localeCompare(b.product));
    emitData();
  }, err=>{ toast('Could not load products: '+err.message,'err'); });

  STATE.db.collection('movements').onSnapshot(snap=>{
    STATE.movements = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    regroupMovements();
    emitData();
  }, err=>{ toast('Could not load stock movements: '+err.message,'err'); });

  window.addEventListener('hashchange', routeFromHash);
}

function restoreSession(){
  let savedId = null;
  try{ savedId = localStorage.getItem('hgt_member_id'); }catch(e){}
  if(savedId){
    const m = STATE.members.find(x=>x.id===savedId && x.active!==false);
    if(m){ STATE.member = m; STATE.ready = true; routeFromHash(); return; }
  }
  STATE.ready = true;
  routeFromHash();
}

function login(member){
  STATE.member = member;
  try{ localStorage.setItem('hgt_member_id', member.id); }catch(e){}
  location.hash = '#/dashboard';
  STATE.loginPick = null; STATE.pin='';
  routeFromHash();
}
function logout(){
  STATE.member = null;
  try{ localStorage.removeItem('hgt_member_id'); }catch(e){}
  STATE.loginPick=null; STATE.pin='';
  routeFromHash();
}

let currentViewMod = null;
function routeFromHash(){
  if(!STATE.ready) return;
  const authRoot = document.getElementById('authRoot');
  const shell = document.getElementById('shell');

  if(!STATE.member){
    shell.hidden = true;
    renderAuth(authRoot);
    return;
  }
  authRoot.innerHTML = '';
  shell.hidden = false;

  const hash = (location.hash||'#/dashboard').replace(/^#\//,'');
  const parts = hash.split('/');
  let view = parts[0] || 'dashboard';
  let sub = parts[1] || null;
  const isAdmin = STATE.member.role==='admin';
  if(view==='admin' && !isAdmin) view='dashboard';
  if(!NAV.find(n=>n.id===view)) view='dashboard';

  STATE.view = view; STATE.sub = sub;
  renderSidebarAndTopbar();

  if(currentViewMod && currentViewMod.unmount) currentViewMod.unmount();
  const mount = VIEWS[view] || VIEWS.dashboard;
  currentViewMod = mount;
  document.getElementById('app').innerHTML = '';
  mount.mount(document.getElementById('app'));
}

  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="auth-brand"><div class="brand-mark"><img src="${LOGO_DATA_URI}" alt="Holland Greentech"></div><h1>${esc(STATE.appConfig.businessName)}</h1></div>

      <div class="pin-pad" id="pinPad"></div>
      <div class="error-text" id="pinErr" style="text-align:center;margin-top:12px;"></div>

  document.getElementById('backBtn').addEventListener('click', ()=>{ STATE.loginPick=null; routeFromHash(); });

  function renderDots(){ dots.innerHTML = [0,1,2,3].map(i=>`<div class="pin-dot ${i<STATE.pin.length?'filled':''}"></div>`).join(''); }
  renderDots();
  const pad = document.getElementById('pinPad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{
    if(k===''){ pad.appendChild(el(`<div></div>`)); return; }
    const b = el(`<button type="button" class="${k==='⌫'?'wide':''}">${k}</button>`);
    b.addEventListener('click', ()=>{
      document.getElementById('pinErr').textContent='';
      if(k==='⌫'){ STATE.pin = STATE.pin.slice(0,-1); renderDots(); return; }
      if(STATE.pin.length<4){ STATE.pin += k; renderDots(); }
      if(STATE.pin.length===4){
        setTimeout(()=>{
          if(String(m.pin)===STATE.pin){ login(m); }
          else{ document.getElementById('pinErr').textContent = 'Incorrect PIN. Try again.'; STATE.pin=''; renderDots(); }
        },120);
      }
    });
    pad.appendChild(b);
  });
}

      </form>

  document.getElementById('obForm').addEventListener('submit', async (e)=>{

/* ===================== reusable: product combobox ===================== */
function attachProductCombobox(inputEl, listEl, onSelect, filterFn){
  let items = [];
  function refresh(q){
    let pool = STATE.products.filter(p=>p.active!==false);
    if(filterFn) pool = pool.filter(filterFn);
    q = (q||'').trim().toLowerCase();
    items = q ? pool.filter(p=> p.product.toLowerCase().includes(q)).slice(0,40) : pool.slice(0,40);
    listEl.innerHTML = items.map(p=>`<div class="combo-opt" data-id="${esc(p.id)}"><span class="p-name">${esc(p.product)}</span><span class="p-meta">${esc(packLabel(p))} · ${esc(p.category||'')}${p.unitPrice!=null?' · '+fmtTZS(p.unitPrice):''}</span></div>`).join('') || `<div class="combo-opt" style="color:var(--ink-faint);cursor:default;">No matching products</div>`;
    listEl.querySelectorAll('.combo-opt[data-id]').forEach(o=>{
      o.addEventListener('mousedown', (ev)=>{
        ev.preventDefault();
        const p = items.find(x=>x.id===o.dataset.id);
        inputEl.value = p.product + ' — ' + packLabel(p);
        listEl.classList.remove('open');
        onSelect(p);
      });
    });
  }
  inputEl.addEventListener('focus', ()=>{ refresh(inputEl.value.includes('—')?'':inputEl.value); listEl.classList.add('open'); });
  inputEl.addEventListener('input', ()=>{ onSelect(null); refresh(inputEl.value); listEl.classList.add('open'); });
  inputEl.addEventListener('blur', ()=> setTimeout(()=>listEl.classList.remove('open'),150));
}

/* ===================== VIEW: Dashboard ===================== */
const VIEWS = {};
VIEWS.dashboard = (function(){
  let handler;
  function content(){
    const active = STATE.products.filter(p=>p.active!==false);
    let low=0, out=0;
    const rows = active.map(p=>({p, s:computeStock(p)}));
    rows.forEach(r=>{ if(r.s.status==='critical') out++; else if(r.s.status==='warn') low++; });
    const today = todayISO();
    const todays = STATE.movements.filter(m=>m.date===today);
    const todaySales = todays.filter(m=>m.type==='sale');
    const todaySalesQty = todaySales.reduce((a,m)=>a+m.quantity,0);
    const priceOf = (id)=>{ const p=STATE.products.find(x=>x.id===id); return p&&p.unitPrice!=null ? Number(p.unitPrice) : 0; };
    const todaySalesValue = todaySales.reduce((a,m)=>a+m.quantity*priceOf(m.productId),0);

    const weekStart = (()=>{ const d=new Date(); d.setDate(d.getDate()-6); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); })();
    const monthStart = today.slice(0,7)+'-01';
    const weekSales = STATE.movements.filter(m=>m.type==='sale' && m.date>=weekStart && m.date<=today);
    const monthSales = STATE.movements.filter(m=>m.type==='sale' && m.date>=monthStart && m.date<=today);
    const weekSalesValue = weekSales.reduce((a,m)=>a+m.quantity*priceOf(m.productId),0);
    const monthSalesValue = monthSales.reduce((a,m)=>a+m.quantity*priceOf(m.productId),0);

    const pricedActive = active.filter(p=>p.unitPrice!=null);
    const inventoryValue = rows.reduce((a,r)=> a + r.s.total * (r.p.unitPrice!=null? Number(r.p.unitPrice):0), 0);

    const branchOnHandTotal = rows.reduce((a,r)=>a+r.s.branchOnHandTotal,0);
    const todayBranchSales = todaySales.filter(m=>m.branch);

    const todayBranchSalesValue = todayBranchSales.reduce((a,m)=>a+m.quantity*priceOf(m.productId),0);

    const attention = rows.filter(r=>r.s.status!=='ok').sort((a,b)=>a.s.total-b.s.total).slice(0,8);

        <div class="page-sub">Live snapshot across Arusha &amp; Moro warehouses</div></div>
        <button class="btn primary" data-go="log">${icon('plus',16)} Log today's movement</button>
      </div>
      <div class="grid cols-4">
        <div class="stat-tile"><div class="stat-label">SKUs tracked</div><div class="stat-value num">${fmt(active.length)}</div><div class="stat-foot">across ${WAREHOUSES.length} warehouses</div></div>
        <div class="stat-tile"><div class="stat-label">Low stock</div><div class="stat-value num warn">${fmt(low)}</div><div class="stat-foot">at or below reorder point</div></div>
        <div class="stat-tile"><div class="stat-label">Out of stock</div><div class="stat-value num critical">${fmt(out)}</div><div class="stat-foot">zero units on hand</div></div>
        <div class="stat-tile"><div class="stat-label">Sold today</div><div class="stat-value num">${fmt(todaySalesQty)}</div><div class="stat-foot">${fmt(todays.length)} entries logged today</div></div>
      </div>

      <div class="section-title">Finance <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:0;">— Tanzanian Shillings (TSh)</span></div>
      <div class="grid cols-4">
        <div class="stat-tile"><div class="stat-label">Inventory value</div><div class="stat-value num">${fmtTZS(inventoryValue)}</div><div class="stat-foot">priced ${fmt(pricedActive.length)} of ${fmt(active.length)} active SKUs</div></div>
        <div class="stat-tile"><div class="stat-label">Sold today</div><div class="stat-value num">${fmtTZS(todaySalesValue)}</div><div class="stat-foot">${fmt(todaySales.length)} sale entries</div></div>
        <div class="stat-tile"><div class="stat-label">Sold this week</div><div class="stat-value num">${fmtTZS(weekSalesValue)}</div><div class="stat-foot">last 7 days</div></div>
        <div class="stat-tile"><div class="stat-label">Sold this month</div><div class="stat-value num">${fmtTZS(monthSalesValue)}</div><div class="stat-foot">since ${fmtDate(monthStart)}</div></div>
      </div>

      <div class="section-title">Branches <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:0;">— Dar, Dodoma, Iringa &amp; Manyara</span></div>
      <div class="grid cols-3">
        <div class="stat-tile"><div class="stat-label">Stock at branches</div><div class="stat-value num">${fmt(branchOnHandTotal)}</div><div class="stat-foot">units on hand, all branches</div></div>
        <div class="stat-tile"><div class="stat-label">Sold today at branches</div><div class="stat-value num">${fmt(todayBranchSalesQty)}</div><div class="stat-foot">${fmtTZS(todayBranchSalesValue)}</div></div>
        <div class="stat-tile" style="display:flex;align-items:center;justify-content:center;"><button class="btn" data-go="branch">${icon('truck',16)} View branch detail</button></div>
      </div>

      <div class="section-title">Needs attention</div>
      ${attention.length? `<div class="table-wrap stack"><table><thead><tr><th>Product</th><th class="num">Arusha</th><th class="num">Moro</th><th class="num">Total</th><th>Reorder pt</th><th>Status</th></tr></thead><tbody>
        ${attention.map(r=>`<tr>
          <td data-label="Product">${esc(r.p.product)} <span style="color:var(--ink-faint)">· ${esc(packLabel(r.p))}</span></td>
          <td data-label="Arusha" class="num">${fmt(r.s.arusha)}</td>
          <td data-label="Moro" class="num">${fmt(r.s.moro)}</td>
          <td data-label="Total" class="num">${fmt(r.s.total)}</td>
          <td data-label="Reorder pt">${r.p.reorderPoint!=null?fmt(r.p.reorderPoint):'—'}</td>
          <td data-label="Status">${statusPill(r.s.status)}</td>
        </tr>`).join('')}
      </tbody></table></div>` : `<div class="card empty">${icon('check',26)}<div>Everything is above its reorder point.</div></div>`}

      <div class="section-title">Recent activity</div>
      ${recent.length? `<div class="table-wrap stack"><table><thead><tr><th>When</th><th>Who</th><th>Product</th><th>Type</th><th class="num">Qty</th></tr></thead><tbody>
        ${recent.map(m=>`<tr>
          <td data-label="When">${fmtDateTime(m.createdAt)}</td>
          <td data-label="Who">${esc(m.memberName||'—')}</td>
          <td data-label="Product">${esc(m.productName||m.productId)}</td>
          <td data-label="Type">${movementTypeLabel(m)}</td>
          <td data-label="Qty" class="num">${fmt(m.quantity!=null?m.quantity:(m.soldQty||0)+(m.notSoldQty||0))}</td>
        </tr>`).join('')}
      </tbody></table></div>` : `<div class="card empty">No movements logged yet.</div>`}
    `;
  }
  return {
    mount(root){
      root.innerHTML = content();
      root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', e=>location.hash='#/'+e.currentTarget.dataset.go));
      handler = ()=>{ root.innerHTML = content(); root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click', e=>location.hash='#/'+e.currentTarget.dataset.go)); };
      bus.addEventListener('data', handler);
    },
    unmount(){ bus.removeEventListener('data', handler); }
  };
})();

function statusPill(status){
  if(status==='critical') return `<span class="pill critical">${icon('alert',12)} Out</span>`;
  if(status==='warn') return `<span class="pill warn">${icon('alert',12)} Low</span>`;
  return `<span class="pill ok">${icon('check',12)} OK</span>`;
}
function movementTypeLabel(m){
  const map = {sale:'Sale', stock_in:'Stock in', stock_out:'Stock out', send_branch:'Sent to branch', return_branch:'Returned to warehouse', branch_result:'Branch result'};
  let base = map[m.type]||m.type;
  if(m.type==='send_branch'){ if(m.warehouse) base += ' · '+m.warehouse; if(m.branch) base += ' → '+m.branch; }
  else if(m.type==='return_branch'){ if(m.branch) base += ' · '+m.branch; if(m.warehouse) base += ' → '+m.warehouse; }
  else { if(m.warehouse) base += ' · '+m.warehouse; if(m.branch) base += ' · '+m.branch; }
  return base;
}

/* ===================== VIEW: Log Entry ===================== */
VIEWS.log = (function(){
  function mount(root){
    root.innerHTML = `
      <div class="page-head"><div><div class="page-title">Log a stock movement</div><div class="page-sub">Record a sale, stock in/out, a dispatch to a branch, or a return from a branch. Updates stock instantly.</div></div></div>
      <div class="card" style="max-width:620px;">
        <form id="logForm">
          <div class="row">
            <div class="field"><label>Date</label><input type="date" id="f_date" value="${todayISO()}" max="${todayISO()}" required></div>
            <div class="field"><label>Movement type</label>
              <select id="f_type">
                <option value="sale">Sale</option>
                <option value="stock_in">Stock in</option>
                <option value="stock_out">Stock out (loss, damage, correction)</option>
                <option value="send_branch">Send to branch</option>
                <option value="return_branch">Return from branch to warehouse</option>
              </select>
            </div>
          </div>
          <div class="field" id="f_locWrap" hidden><label>Sold from</label>
            <select id="f_loc"><option value="warehouse">Warehouse</option><option value="branch">Branch</option></select>
          </div>
          <div class="field combo">
            <label>Product</label>
            <input type="text" id="f_product" placeholder="Start typing a product name…" autocomplete="off" required>
            <div class="combo-list" id="f_productList"></div>
            <div class="error-text" id="f_productErr" hidden>Pick a product from the list.</div>
          </div>
          <div class="row">
            <div class="field" id="f_wareWrap"><label id="f_wareLabel">Warehouse</label>
              <select id="f_warehouse">${WAREHOUSES.map(w=>`<option>${w}</option>`).join('')}</select>
            </div>
            <div class="field" id="f_branchWrap" hidden><label id="f_branchLabel">Branch</label>
              <select id="f_branch">${BRANCHES.map(b=>`<option>${b}</option>`).join('')}</select>
            </div>
            <div class="field"><label>Quantity</label><input type="number" id="f_qty" min="1" step="1" required></div>
          </div>
          <div class="field" id="f_originWrap" hidden><label>Origin (imports)</label>
            <select id="f_origin">${ORIGINS.map(o=>`<option>${o}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Notes <span style="font-weight:400;color:var(--ink-faint)">(optional)</span></label><textarea id="f_notes" maxlength="240" placeholder="Any remarks…"></textarea></div>
          <button class="btn primary block" type="submit">${icon('plus',16)} Save movement</button>
        </form>
      </div>
    `;
    const typeSel = document.getElementById('f_type');
    const locWrap = document.getElementById('f_locWrap'), locSel = document.getElementById('f_loc');
    const wareWrap = document.getElementById('f_wareWrap'), branchWrap = document.getElementById('f_branchWrap'), originWrap = document.getElementById('f_originWrap');
    const wareLabel = document.getElementById('f_wareLabel'), branchLabel = document.getElementById('f_branchLabel');
    function syncFields(){
      const t = typeSel.value;
      const isSale = t==='sale';
      locWrap.hidden = !isSale;
      originWrap.hidden = t!=='stock_in';
      wareLabel.textContent = 'Warehouse'; branchLabel.textContent = 'Branch';
      if(t==='send_branch'){
        wareWrap.hidden = false; branchWrap.hidden = false;
        wareLabel.textContent = 'From warehouse'; branchLabel.textContent = 'To branch';
      } else if(t==='return_branch'){
        wareWrap.hidden = false; branchWrap.hidden = false;
        branchLabel.textContent = 'From branch'; wareLabel.textContent = 'To warehouse';
      } else if(isSale && locSel.value==='branch'){
        wareWrap.hidden = true; branchWrap.hidden = false;
      } else {
        wareWrap.hidden = false; branchWrap.hidden = true;
      }
    }
    typeSel.addEventListener('change', syncFields); locSel.addEventListener('change', syncFields); syncFields();

    let selectedProduct = null;
    attachProductCombobox(document.getElementById('f_product'), document.getElementById('f_productList'), (p)=>{ selectedProduct = p; document.getElementById('f_productErr').hidden = true; });

    document.getElementById('logForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!selectedProduct){ document.getElementById('f_productErr').hidden = false; return; }
      const type = typeSel.value;
      const qty = parseInt(document.getElementById('f_qty').value,10);
      if(!qty || qty<1){ toast('Enter a quantity of at least 1','err'); return; }
      const doc = {
        date: document.getElementById('f_date').value || todayISO(),
        productId: selectedProduct.id, productName: selectedProduct.product+' — '+packLabel(selectedProduct),
        type, quantity: qty,
        notes: document.getElementById('f_notes').value.trim(),
        memberId: STATE.member.id, memberName: STATE.member.name,
        createdAt: new Date().toISOString(),
      };
      const sellingFromBranch = type==='sale' && locSel.value==='branch';
      if(type==='send_branch' || type==='return_branch'){
        doc.warehouse = document.getElementById('f_warehouse').value;
        doc.branch = document.getElementById('f_branch').value;
      } else if(sellingFromBranch){ doc.branch = document.getElementById('f_branch').value; doc.warehouse = null; }
      else { doc.warehouse = document.getElementById('f_warehouse').value; doc.branch = null; }
      if(type==='stock_in'){ doc.origin = document.getElementById('f_origin').value; }
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving…';
      try{
        await STATE.db.collection('movements').add(doc);
        toast('Movement saved','ok');
        e.target.reset();
        selectedProduct = null;
        document.getElementById('f_date').value = todayISO();
        syncFields();
      }catch(err){ toast('Could not save: '+err.message,'err'); }
      btn.disabled=false; btn.innerHTML = `${icon('plus',16)} Save movement`;
    });
  }
  return {mount, unmount(){}};
})();

/* ===================== VIEW: Branches ===================== */
VIEWS.branch = (function(){
  let handler;
  function content(){
    const priceOf = (id)=>{ const p=STATE.products.find(x=>x.id===id); return p&&p.unitPrice!=null ? Number(p.unitPrice) : 0; };
    const today = todayISO();
    const monthStart = today.slice(0,7)+'-01';
    const summary = {}; BRANCHES.forEach(b=> summary[b] = {onHand:0, value:0, salesQtyMonth:0, salesValueMonth:0});
    const outstanding = [];
    for(const p of STATE.products){
      if(p.active===false) continue;
      const s = computeStock(p);
      for(const b of BRANCHES){
        const remain = s.branch[b].onHand;
        summary[b].onHand += remain;
        if(p.unitPrice!=null) summary[b].value += remain*p.unitPrice;
        if(remain>0) outstanding.push({product:p, branch:b, remain});
      }
    }
    STATE.movements.filter(m=>m.type==='sale' && m.branch && m.date>=monthStart && m.date<=today).forEach(m=>{
      if(summary[m.branch]){ summary[m.branch].salesQtyMonth += m.quantity; summary[m.branch].salesValueMonth += m.quantity*priceOf(m.productId); }
    });

    return `
      <div class="page-head"><div><div class="page-title">Branches</div><div class="page-sub">Real-time stock on hand and sales at Dar, Dodoma, Iringa &amp; Manyara.</div></div></div>
      <div class="grid cols-4" style="margin-bottom:16px;">
        ${BRANCHES.map(b=>`
          <div class="stat-tile">
            <div class="stat-label">${esc(b)}</div>
            <div class="stat-value num">${fmt(summary[b].onHand)}</div>
            <div class="stat-foot">on hand${summary[b].value?' · '+fmtTZS(summary[b].value):''}</div>
            <div class="stat-foot">${fmt(summary[b].salesQtyMonth)} sold this month${summary[b].salesValueMonth?' · '+fmtTZS(summary[b].salesValueMonth):''}</div>
          </div>
        `).join('')}
      </div>
      <div class="grid cols-2" style="align-items:start;">
        <div class="card">
          <div style="font-weight:700;margin-bottom:4px;">Record a write-off or return</div>
          <p class="hint" style="margin-bottom:12px;">Day-to-day branch sales are logged from Log Entry (choose "Sold from: Branch") and deduct stock instantly. Sending stock physically back to a warehouse is also done from Log Entry ("Return from branch to warehouse") and adds it back to that warehouse's stock. Use this form only to write off stock that stays at the branch but won't be sold — damaged, expired, or lost.</p>
          <form id="brForm">
            <div class="field"><label>Date</label><input type="date" id="b_date" value="${todayISO()}" max="${todayISO()}" required></div>
            <div class="field"><label>Branch</label><select id="b_branch">${BRANCHES.map(b=>`<option>${b}</option>`).join('')}</select></div>
            <div class="field combo"><label>Product</label>
              <input type="text" id="b_product" placeholder="Start typing a product name…" autocomplete="off" required>
              <div class="combo-list" id="b_productList"></div>
              <div class="error-text" id="b_productErr" hidden>Pick a product from the list.</div>
            </div>
            <div class="row">
              <div class="field"><label>Sold <span style="font-weight:400;color:var(--ink-faint)">(only if not logged via Log Entry)</span></label><input type="number" id="b_sold" min="0" step="1" value="0"></div>
              <div class="field"><label>Written off <span style="font-weight:400;color:var(--ink-faint)">(damaged/expired)</span></label><input type="number" id="b_notsold" min="0" step="1" value="0"></div>
            </div>
            <div class="field"><label>Notes <span style="font-weight:400;color:var(--ink-faint)">(optional)</span></label><textarea id="b_notes" maxlength="240"></textarea></div>
            <button class="btn primary block" type="submit">${icon('check',16)} Save branch update</button>
          </form>
        </div>
        <div class="card">
          <div style="font-weight:700;margin-bottom:10px;">Stock at branches, by product</div>
          ${outstanding.length? `<div class="table-wrap stack" style="border:none;"><table><thead><tr><th>Product</th><th>Branch</th><th class="num">On hand</th></tr></thead><tbody>
            ${outstanding.sort((a,b)=>b.remain-a.remain).slice(0,30).map(o=>`<tr><td data-label="Product">${esc(o.product.product)}</td><td data-label="Branch">${o.branch}</td><td data-label="Qty" class="num">${fmt(o.remain)}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="empty">Nothing at branches right now.</div>`}
        </div>
      </div>
    `;
  }
  function wire(root){
    let selectedProduct = null;
    attachProductCombobox(document.getElementById('b_product'), document.getElementById('b_productList'), (p)=>{ selectedProduct = p; document.getElementById('b_productErr').hidden = true; });
    document.getElementById('brForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!selectedProduct){ document.getElementById('b_productErr').hidden = false; return; }
      const sold = parseInt(document.getElementById('b_sold').value,10)||0;
      const notSold = parseInt(document.getElementById('b_notsold').value,10)||0;
      if(sold<=0 && notSold<=0){ toast('Enter a sold or not-sold quantity','err'); return; }
      const doc = {
        date: document.getElementById('b_date').value || todayISO(),
        productId: selectedProduct.id, productName: selectedProduct.product+' — '+packLabel(selectedProduct),
        type:'branch_result', branch: document.getElementById('b_branch').value,
        soldQty: sold, notSoldQty: notSold,
        notes: document.getElementById('b_notes').value.trim(),
        memberId: STATE.member.id, memberName: STATE.member.name,
        createdAt: new Date().toISOString(),
      };
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving…';
      try{ await STATE.db.collection('movements').add(doc); toast('Branch update saved','ok'); renderInto(root); }
      catch(err){ toast('Could not save: '+err.message,'err'); btn.disabled=false; }
    });
  }
  function renderInto(root){ root.innerHTML = content(); wire(root); }
  return {
    mount(root){ root.innerHTML = content(); wire(root); handler = ()=>renderInto(root); bus.addEventListener('data', handler); },
    unmount(){ bus.removeEventListener('data', handler); }
  };
})();

/* ===================== VIEW: Stock Report ===================== */
VIEWS.stock = (function(){
  let handler, filters = {q:'', cat:'all', status:'all'};
  function content(){
    const cats = Array.from(new Set(STATE.products.map(p=>p.category||'OTHER'))).sort();
    let rows = STATE.products.filter(p=>p.active!==false).map(p=>({p, s:computeStock(p)}));
    if(filters.q) rows = rows.filter(r=>r.p.product.toLowerCase().includes(filters.q.toLowerCase()));
    if(filters.cat!=='all') rows = rows.filter(r=>(r.p.category||'OTHER')===filters.cat);
    if(filters.status!=='all') rows = rows.filter(r=>r.s.status===filters.status);
    rows.sort((a,b)=>a.p.product.localeCompare(b.p.product));
    const totals = rows.reduce((a,r)=>({arusha:a.arusha+r.s.arusha, moro:a.moro+r.s.moro, total:a.total+r.s.total, branches:a.branches+r.s.branchOnHandTotal, company:a.company+r.s.companyTotal}), {arusha:0,moro:0,total:0,branches:0,company:0});
    const totalValue = rows.reduce((a,r)=> a + r.s.total * (r.p.unitPrice!=null? Number(r.p.unitPrice):0), 0);
    const branchValue = rows.reduce((a,r)=> a + r.s.branchOnHandTotal * (r.p.unitPrice!=null? Number(r.p.unitPrice):0), 0);

    return `
      <div class="page-head">
        <div><div class="page-title">Stock report</div><div class="page-sub">Real-time stock on hand — warehouses and branches — computed from today's movements.</div></div>
        <button class="btn" id="exportStock">${icon('download',16)} Export CSV</button>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="row">
          <div class="search-input">${icon('search',16)}<input type="text" id="sf_q" placeholder="Search product…" value="${esc(filters.q)}"></div>
          <select id="sf_cat"><option value="all">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${filters.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
          <select id="sf_status">
            <option value="all" ${filters.status==='all'?'selected':''}>All statuses</option>
            <option value="ok" ${filters.status==='ok'?'selected':''}>OK</option>
            <option value="warn" ${filters.status==='warn'?'selected':''}>Low</option>
            <option value="critical" ${filters.status==='critical'?'selected':''}>Out of stock</option>
          </select>
        </div>
      </div>
      <div class="grid cols-4" style="margin-bottom:16px;">
        <div class="stat-tile"><div class="stat-label">Arusha total</div><div class="stat-value num">${fmt(totals.arusha)}</div></div>
        <div class="stat-tile"><div class="stat-label">Moro total</div><div class="stat-value num">${fmt(totals.moro)}</div></div>
        <div class="stat-tile"><div class="stat-label">Warehouse total</div><div class="stat-value num">${fmt(totals.total)}</div><div class="stat-foot">${fmtTZS(totalValue)}</div></div>
        <div class="stat-tile"><div class="stat-label">At branches</div><div class="stat-value num">${fmt(totals.branches)}</div><div class="stat-foot">${fmtTZS(branchValue)}</div></div>
      </div>
      <div class="table-wrap stack"><table><thead><tr><th>Product</th><th>Category</th><th class="num">Arusha</th><th class="num">Moro</th><th class="num">Warehouse tot.</th><th class="num">At branches</th><th class="num">Value (TSh)</th><th>Reorder pt</th><th>Status</th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td data-label="Product">${esc(r.p.product)} <span class="mono" style="color:var(--ink-faint);font-size:11.5px;">${esc(packLabel(r.p))}</span></td>
          <td data-label="Category">${esc(r.p.category||'—')}</td>
          <td data-label="Arusha" class="num">${fmt(r.s.arusha)}</td>
          <td data-label="Moro" class="num">${fmt(r.s.moro)}</td>
          <td data-label="Warehouse total" class="num">${fmt(r.s.total)}</td>
          <td data-label="At branches" class="num">${fmt(r.s.branchOnHandTotal)}</td>
          <td data-label="Value" class="num">${r.p.unitPrice!=null?fmtTZS(r.s.companyTotal*r.p.unitPrice):'—'}</td>
          <td data-label="Reorder pt">${r.p.reorderPoint!=null?fmt(r.p.reorderPoint):'—'}</td>
          <td data-label="Status">${statusPill(r.s.status)}</td>
        </tr>`).join('') || `<tr><td colspan="9"><div class="empty">No products match.</div></td></tr>`}
      </tbody></table></div>
    `;
  }
  function wire(root){
    root.querySelector('#sf_q').addEventListener('input', e=>{ filters.q=e.target.value; renderInto(root); });
    root.querySelector('#sf_cat').addEventListener('change', e=>{ filters.cat=e.target.value; renderInto(root); });
    root.querySelector('#sf_status').addEventListener('change', e=>{ filters.status=e.target.value; renderInto(root); });
    root.querySelector('#exportStock').addEventListener('click', async ()=>{

/* ===================== VIEW: Sales Report ===================== */
VIEWS.sales = (function(){
  let handler, filters = null;
  function defaultFilters(){
    const end = todayISO();
    const d = new Date(); d.setDate(d.getDate()-6);
    const off=d.getTimezoneOffset(); const start = new Date(d.getTime()-off*60000).toISOString().slice(0,10);
    return {start, end, member:'all'};
  }
  function content(){
    if(!filters) filters = defaultFilters();
    const sales = STATE.movements.filter(m=>m.type==='sale' && m.date>=filters.start && m.date<=filters.end && (filters.member==='all'||m.memberId===filters.member));
    const priceOf = (id)=>{ const p=STATE.products.find(x=>x.id===id); return p&&p.unitPrice!=null ? Number(p.unitPrice) : 0; };
    const locOf = (s)=> s.branch || s.warehouse || '—';
    const byProduct = new Map();
    for(const s of sales){ const k=s.productId; if(!byProduct.has(k)) byProduct.set(k,{name:s.productName||s.productId, qty:0, warehouseQty:0, branchQty:0, revenue:0}); const r=byProduct.get(k); r.qty+=s.quantity; r.revenue+=s.quantity*priceOf(s.productId); if(s.branch) r.branchQty+=s.quantity; else r.warehouseQty+=s.quantity; }
    const rows = Array.from(byProduct.values()).sort((a,b)=>b.qty-a.qty);
    const totalQty = rows.reduce((a,r)=>a+r.qty,0);
    const totalRevenue = rows.reduce((a,r)=>a+r.revenue,0);
    const byMember = new Map();
    for(const s of sales){ const k=s.memberId||'—'; if(!byMember.has(k)) byMember.set(k,{qty:0,revenue:0}); const r=byMember.get(k); r.qty+=s.quantity; r.revenue+=s.quantity*priceOf(s.productId); }
    const memberRows = Array.from(byMember.entries()).map(([id,r])=>({name: (STATE.members.find(m=>m.id===id)||{}).name || 'Unknown', qty:r.qty, revenue:r.revenue})).sort((a,b)=>b.qty-a.qty);
    const byLoc = new Map(); [...WAREHOUSES, ...BRANCHES].forEach(l=>byLoc.set(l,{qty:0,revenue:0,entries:0}));
    for(const s of sales){ const k=locOf(s); if(!byLoc.has(k)) byLoc.set(k,{qty:0,revenue:0,entries:0}); const r=byLoc.get(k); r.qty+=s.quantity; r.revenue+=s.quantity*priceOf(s.productId); r.entries++; }
    const locRows = Array.from(byLoc.entries()).map(([name,r])=>({name, kind: BRANCHES.includes(name)?'Branch':'Warehouse', ...r}));
    const branchSalesQty = locRows.filter(r=>r.kind==='Branch').reduce((a,r)=>a+r.qty,0);

    return `
      <div class="page-head">
        <div><div class="page-title">Sales report</div><div class="page-sub">Units sold across warehouses and branches for the selected period.</div></div>
        <button class="btn" id="exportSales">${icon('download',16)} Export CSV</button>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="row">
          <div class="field" style="margin:0;"><label>From</label><input type="date" id="sa_start" value="${filters.start}" max="${todayISO()}"></div>
          <div class="field" style="margin:0;"><label>To</label><input type="date" id="sa_end" value="${filters.end}" max="${todayISO()}"></div>
          <div class="field" style="margin:0;"><label>Member</label><select id="sa_member"><option value="all">Everyone</option>${STATE.members.map(m=>`<option value="${esc(m.id)}" ${filters.member===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
        </div>
      </div>
      <div class="grid cols-4" style="margin-bottom:16px;">
        <div class="stat-tile"><div class="stat-label">Units sold</div><div class="stat-value num">${fmt(totalQty)}</div><div class="stat-foot">${fmt(branchSalesQty)} at branches</div></div>
        <div class="stat-tile"><div class="stat-label">Products sold</div><div class="stat-value num">${fmt(rows.length)}</div></div>
        <div class="stat-tile"><div class="stat-label">Sale entries</div><div class="stat-value num">${fmt(sales.length)}</div></div>
        <div class="stat-tile"><div class="stat-label">Revenue</div><div class="stat-value num">${fmtTZS(totalRevenue)}</div></div>
      </div>
      <div class="section-title" style="margin-top:0;">By location</div>
      <div class="table-wrap stack" style="margin-bottom:16px;"><table><thead><tr><th>Location</th><th>Kind</th><th class="num">Entries</th><th class="num">Units sold</th><th class="num">Revenue (TSh)</th></tr></thead><tbody>
        ${locRows.filter(r=>r.entries>0).sort((a,b)=>b.qty-a.qty).map(r=>`<tr><td data-label="Location">${esc(r.name)}</td><td data-label="Kind">${r.kind}</td><td data-label="Entries" class="num">${fmt(r.entries)}</td><td data-label="Units" class="num">${fmt(r.qty)}</td><td data-label="Revenue" class="num">${fmtTZS(r.revenue)}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty">No sales in this period.</div></td></tr>`}
      </tbody></table></div>
      <div class="grid cols-2" style="align-items:start;">
        <div>
          <div class="section-title" style="margin-top:0;">By product</div>
          <div class="table-wrap stack"><table><thead><tr><th>Product</th><th class="num">Warehouse</th><th class="num">Branches</th><th class="num">Total</th><th class="num">Revenue (TSh)</th></tr></thead><tbody>
            ${rows.map(r=>`<tr><td data-label="Product">${esc(r.name)}</td><td data-label="Warehouse" class="num">${fmt(r.warehouseQty)}</td><td data-label="Branches" class="num">${fmt(r.branchQty)}</td><td data-label="Total" class="num">${fmt(r.qty)}</td><td data-label="Revenue" class="num">${fmtTZS(r.revenue)}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty">No sales in this period.</div></td></tr>`}
          </tbody></table></div>
        </div>
        <div>
          <div class="section-title" style="margin-top:0;">By member</div>
          <div class="table-wrap stack"><table><thead><tr><th>Member</th><th class="num">Units sold</th><th class="num">Revenue (TSh)</th></tr></thead><tbody>
            ${memberRows.map(r=>`<tr><td data-label="Member">${esc(r.name)}</td><td data-label="Units" class="num">${fmt(r.qty)}</td><td data-label="Revenue" class="num">${fmtTZS(r.revenue)}</td></tr>`).join('') || `<tr><td colspan="3"><div class="empty">No sales in this period.</div></td></tr>`}
          </tbody></table></div>
        </div>
      </div>
    `;
  }
  function wire(root){
    root.querySelector('#sa_start').addEventListener('change', e=>{ filters.start=e.target.value; renderInto(root); });
    root.querySelector('#sa_end').addEventListener('change', e=>{ filters.end=e.target.value; renderInto(root); });
    root.querySelector('#sa_member').addEventListener('change', e=>{ filters.member=e.target.value; renderInto(root); });
    root.querySelector('#exportSales').addEventListener('click', async ()=>{
      const sales = STATE.movements.filter(m=>m.type==='sale' && m.date>=filters.start && m.date<=filters.end && (filters.member==='all'||m.memberId===filters.member));
      const priceOf = (id)=>{ const p=STATE.products.find(x=>x.id===id); return p&&p.unitPrice!=null ? Number(p.unitPrice) : 0; };
      const csv = toCSV([['Date','Product','Warehouse','Branch','Quantity','Unit price (TSh)','Amount (TSh)','Member','Notes'], ...sales.map(s=>[s.date,s.productName||s.productId,s.warehouse||'',s.branch||'',s.quantity,priceOf(s.productId)||'',priceOf(s.productId)?s.quantity*priceOf(s.productId):'',s.memberName||'',s.notes||''])]);
      await offerDownload('sales-report-'+filters.start+'-to-'+filters.end+'.csv', csv);
    });
  }
  function renderInto(root){ root.innerHTML = content(); wire(root); }
  return {
    mount(root){ root.innerHTML = content(); wire(root); handler = ()=>renderInto(root); bus.addEventListener('data', handler); },
    unmount(){ bus.removeEventListener('data', handler); }
  };
})();

/* ===================== VIEW: Activity ===================== */
VIEWS.activity = (function(){
  let handler, filters = {start:'', end:'', type:'all', member:'all', q:''};
  function content(){
    let rows = STATE.movements.slice();
    if(filters.start) rows = rows.filter(m=>m.date>=filters.start);
    if(filters.end) rows = rows.filter(m=>m.date<=filters.end);

    if(filters.member!=='all') rows = rows.filter(m=>m.memberId===filters.member);
    if(filters.q) rows = rows.filter(m=>(m.productName||'').toLowerCase().includes(filters.q.toLowerCase()));
    rows.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    const shown = rows.slice(0,200);
    return `

        </div>
        <div class="row" style="margin-top:10px;">
          <div class="field" style="margin:0;"><label>From</label><input type="date" id="af_start" value="${filters.start}"></div>

        ${shown.map(m=>`<tr>
          <td data-label="Date">${fmtDate(m.date)}</td>

          <td data-label="Type">${movementTypeLabel(m)}</td>

          <td data-label="Who">${esc(m.memberName||'—')}</td>
          <td data-label="Notes" style="color:var(--ink-soft)">${esc(m.notes||'')}</td>
        </tr>`).join('') || `<tr><td colspan="6"><div class="empty">No activity matches these filters.</div></td></tr>`}
      </tbody></table></div>
    `;
  }
  function wire(root){
    root.querySelector('#af_q').addEventListener('input', e=>{ filters.q=e.target.value; renderInto(root); });
    root.querySelector('#af_type').addEventListener('change', e=>{ filters.type=e.target.value; renderInto(root); });

    root.querySelector('#af_end').addEventListener('change', e=>{ filters.end=e.target.value; renderInto(root); });
    root.querySelector('#exportAct').addEventListener('click', async ()=>{

        ...rows.map(m=>[m.date,m.productName||m.productId,m.type,m.warehouse||'',m.branch||'',m.quantity!=null?m.quantity:'',m.soldQty!=null?m.soldQty:'',m.notSoldQty!=null?m.notSoldQty:'',m.memberName||'',m.notes||'',m.createdAt||''])]);
      await offerDownload('activity-log-'+todayISO()+'.csv', csv);

  }
  function renderInto(root){ root.innerHTML = content(); wire(root); }
  return {
    mount(root){ root.innerHTML = content(); wire(root); handler = ()=>renderInto(root); bus.addEventListener('data', handler); },
    unmount(){ bus.removeEventListener('data', handler); }
  };
})();

/* ===================== VIEW: Admin ===================== */

    render(root);
    handler = ()=>{ if(tab==='team') renderTeam(document.getElementById('adminBody')); if(tab==='products') renderProducts(document.getElementById('adminBody')); };
    bus.addEventListener('data', handler);
  }

    root.innerHTML = `
      <div class="page-head"><div><div class="page-title">Admin</div><div class="page-sub">Manage your team, the product list, and business settings.</div></div></div>
      <div class="tabs">
        <div class="tab ${tab==='team'?'active':''}" data-tab="team">Team</div>

        ${rows.map(m=>`<tr data-id="${esc(m.id)}">
          <td data-label="Name">${esc(m.name)}</td>
          <td data-label="Role">${m.role==='admin'?'<span class="pill admin">Admin</span>':'<span class="pill neutral">Staff</span>'}</td>
          <td data-label="Status">${m.active===false?'<span class="pill critical">Inactive</span>':'<span class="pill ok">Active</span>'}</td>

            <button class="btn small ghost" data-act="toggle">${m.active===false?'Reactivate':'Deactivate'}</button>
          </td>
        </tr>`).join('')}
      </tbody></table></div>
    `;

      e.preventDefault();

      const reorder = document.getElementById('p_reorder').value===''? null : parseInt(document.getElementById('p_reorder').value,10);
      const price = document.getElementById('p_price').value===''? null : parseFloat(document.getElementById('p_price').value);
      if(!name || !pack){ toast('Enter a name and pack size','err'); return; }
      let id = slugify(name)+'-'+pack; let n=1;
      while(STATE.products.some(p=>p.id===id)){ n++; id = slugify(name)+'-'+pack+'-'+n; }
      try{
        await STATE.db.doc('products/'+id).set({ product:name, packSize:pack, category:cat, type:typ, reorderPoint:reorder, unitPrice:price, baselineArusha:0, baselineMoro:0, baselineDate: todayISO(), active:true });
        toast('Product added','ok'); e.target.reset();
      }catch(err){ toast('Could not add product: '+err.message,'err'); }
    });
  }

  function renderSettings(body){
    if(!body) return;
    body.innerHTML = `
      <div class="card" style="max-width:520px;margin-bottom:16px;">
        <div style="font-weight:700;margin-bottom:10px;">Business name</div>
        <form id="bizForm">
          <div class="field"><input type="text" id="bizName" value="${esc(STATE.appConfig.businessName)}" maxlength="60"></div>
          <button class="btn primary" type="submit">Save</button>
        </form>
      </div>
      <div class="card" style="max-width:520px;">
        <div style="font-weight:700;margin-bottom:6px;">Archive old movements</div>
        <p class="hint" style="margin-bottom:12px;">Folds everything before a chosen date into each product's starting stock, downloads a full CSV backup, then clears those entries — keeps the log fast and within storage limits. This can't be undone, but nothing is lost: it's all in the CSV.</p>
        <div class="field"><label>Archive everything logged before</label><input type="date" id="archiveDate" max="${todayISO()}"></div>
        <div class="hint" id="archiveCount" style="margin-bottom:12px;"></div>
        <button class="btn danger" id="archiveBtn">${icon('archive',16)} Archive &amp; download backup</button>
      </div>
    `;
    document.getElementById('bizForm').addEventListener('submit', async e=>{
      e.preventDefault();
      try{ await STATE.db.doc('app/config').set({businessName: document.getElementById('bizName').value.trim() || 'Holland Greentech'}); toast('Saved','ok'); }
      catch(err){ toast(err.message,'err'); }
    });
    const dateInput = document.getElementById('archiveDate');
    function countBefore(){
      const cutoff = dateInput.value;
      if(!cutoff){ document.getElementById('archiveCount').textContent=''; return 0; }
      const n = STATE.movements.filter(m=>m.date<cutoff).length;
      document.getElementById('archiveCount').textContent = n+' entr'+(n===1?'y':'ies')+' will be archived.';
      return n;
    }
    dateInput.addEventListener('change', countBefore);
    document.getElementById('archiveBtn').addEventListener('click', async ()=>{
      const cutoff = dateInput.value;
      if(!cutoff){ toast('Choose a cutoff date first','err'); return; }
      const toArchive = STATE.movements.filter(m=>m.date<cutoff);
      if(toArchive.length===0){ toast('Nothing to archive before that date','err'); return; }
      openModal(`
        <h3>Archive ${toArchive.length} entries?</h3>
        <p>Everything logged before ${fmtDate(cutoff)} will be folded into each product's stock baseline, backed up to a CSV you'll download, and then removed from the live log.</p>
        <div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="confirmArchive">Archive now</button></div>
      `);
      document.getElementById('confirmArchive').addEventListener('click', async ()=>{
        const btn = document.getElementById('confirmArchive'); btn.disabled=true; btn.textContent='Archiving…';
        try{
          const csv = toCSV([['Date','Product','Type','Warehouse','Branch','Quantity','Sold','NotSold','Origin','Member','Notes','Logged at'],
            ...toArchive.map(m=>[m.date,m.productName||m.productId,m.type,m.warehouse||'',m.branch||'',m.quantity!=null?m.quantity:'',m.soldQty!=null?m.soldQty:'',m.notSoldQty!=null?m.notSoldQty:'',m.origin||'',m.memberName||'',m.notes||'',m.createdAt||''])]);
          await offerDownload('hgt-archive-before-'+cutoff+'.csv', csv);
          const byProduct = new Map();
          for(const m of toArchive){ if(!byProduct.has(m.productId)) byProduct.set(m.productId,[]); byProduct.get(m.productId).push(m); }
          for(const p of STATE.products){
            const list = byProduct.get(p.id); if(!list) continue;
            const s = computeStock(p);
            let arusha = p.baselineArusha||0, moro = p.baselineMoro||0;
            const branch = {}; BRANCHES.forEach(b=>{ const bb=(p.baselineBranch&&p.baselineBranch[b])||{}; branch[b] = {sent:bb.sent||0, sold:bb.sold||0, notSold:bb.notSold||0, returned:bb.returned||0}; });
            for(const m of list){
              if(p.baselineDate && m.date < p.baselineDate) continue;
              if(m.type==='stock_in'){ if(m.warehouse==='Arusha') arusha+=m.quantity; else if(m.warehouse==='Moro') moro+=m.quantity; }
              else if(m.type==='stock_out'){ if(m.warehouse==='Arusha') arusha-=m.quantity; else if(m.warehouse==='Moro') moro-=m.quantity; }
              else if(m.type==='sale'){
                if(m.warehouse==='Arusha') arusha-=m.quantity;
                else if(m.warehouse==='Moro') moro-=m.quantity;
                else if(m.branch && branch[m.branch]) branch[m.branch].sold += m.quantity;
              }
              else if(m.type==='send_branch'){
                if(m.warehouse==='Arusha') arusha-=m.quantity; else if(m.warehouse==='Moro') moro-=m.quantity;
                if(branch[m.branch]) branch[m.branch].sent += m.quantity;
              }
              else if(m.type==='return_branch'){
                if(branch[m.branch]) branch[m.branch].returned += m.quantity;
                if(m.warehouse==='Arusha') arusha+=m.quantity; else if(m.warehouse==='Moro') moro+=m.quantity;
              }
              else if(m.type==='branch_result'){
                if(branch[m.branch]){ branch[m.branch].sold += (m.soldQty||0); branch[m.branch].notSold += (m.notSoldQty||0); }
              }
            }
            await STATE.db.doc('products/'+p.id).update({baselineArusha:arusha, baselineMoro:moro, baselineBranch:branch, baselineDate:cutoff});
          }
          for(const m of toArchive){ await STATE.db.doc('movements/'+m.id).delete(); }
          toast('Archived '+toArchive.length+' entries','ok');
          closeModal();
        }catch(err){ toast('Archive failed: '+err.message,'err'); btn.disabled=false; btn.textContent='Archive now'; }
      });
    });
  }

  return {mount, unmount};
})();

/* ===================== modal / downloads ===================== */
function openModal(html){
  const bd = el(`<div class="modal-backdrop"><div class="modal">${html}</div></div>`);
  document.body.appendChild(bd);
  bd.addEventListener('click', e=>{ if(e.target===bd) closeModal(); });
  bd.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}
function closeModal(){ document.querySelector('.modal-backdrop')?.remove(); }

async function offerDownload(filename, csv){
  if(STATE.downloads){
    try{ await STATE.downloads.save({filename, data:csv}); toast('Download ready','ok'); return; }
    catch(err){ if(err && err.code==='not_granted'){ /* fall through */ } else { toast('Download failed: '+(err&&err.message||err),'err'); return; } }
  }
  try{
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){ toast('Could not prepare download','err'); }
}

boot();
})();
</script>
