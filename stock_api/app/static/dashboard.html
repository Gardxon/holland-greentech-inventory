<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HGT Stock & Sales System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #3A6B4F;
            --secondary: #8A6D3B;
            --danger: #A63B2E;
            --warning: #9C6A0A;
            --success: #2D5016;
            --bg: #faf9f5;
            --surface: #ffffff;
            --border: #e1ddce;
            --text: #1b2420;
            --text-light: #586257;
            --shadow: 0 1px 2px rgba(27,36,32,.06), 0 6px 20px -8px rgba(27,36,32,.18);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--surface);
            padding: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
            box-shadow: var(--shadow);
        }

        h1, h2, h3 { color: var(--text); margin: 0 0 10px 0; }
        h1 { font-size: 32px; }
        h2 { font-size: 24px; margin-top: 30px; }
        h3 { font-size: 18px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .stat-card {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, rgba(58, 107, 79, 0.8) 100%);
            color: white;
            border-radius: 10px;
        }

        .stat-card h3 { color: white; font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: bold; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: var(--surface);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        tr:hover { background: var(--bg); }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2d5740;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(58, 107, 79, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal.active { display: flex; align-items: center; justify-content: center; }

        .modal-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #E4EEE6;
            color: #2d5016;
        }

        .alert-error {
            background: #FBE7E1;
            color: #A63B2E;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input { flex: 1; }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🌱 HGT Stock & Sales System</h1>
            <p style="color: var(--text-light); margin: 5px 0 0 0;">Real-time inventory management across branches</p>
        </div>
    </header>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="dashboard">Dashboard</button>
            <button class="tab" data-tab="products">Products</button>
            <button class="tab" data-tab="branches">Branches</button>
            <button class="tab" data-tab="inventory">Inventory</button>
            <button class="tab" data-tab="sales">Sales</button>
        </div>

        <!-- Alert -->
        <div id="alert" class="alert alert-success" style="display:none;"></div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content active">
            <h2>Dashboard</h2>
            <div class="grid">
                <div class="stat-card">
                    <h3>Total Products</h3>
                    <div class="value" id="totalProducts">-</div>
                </div>
                <div class="stat-card">
                    <h3>Total Branches</h3>
                    <div class="value" id="totalBranches">-</div>
                </div>
                <div class="stat-card">
                    <h3>Total Stock Units</h3>
                    <div class="value" id="totalStock">-</div>
                </div>
                <div class="stat-card">
                    <h3>Today's Sales</h3>
                    <div class="value" id="todaysSales">-</div>
                </div>
            </div>
        </div>

        <!-- Products Tab -->
        <div id="products" class="tab-content">
            <h2>Products</h2>
            <div class="input-group">
                <input type="text" id="productSearch" placeholder="Search products...">
                <button class="btn btn-primary" onclick="showProductModal()">+ Add Product</button>
            </div>
            <div id="productsTable"></div>
        </div>

        <!-- Branches Tab -->
        <div id="branches" class="tab-content">
            <h2>Branches</h2>
            <button class="btn btn-primary" onclick="showBranchModal()">+ Add Branch</button>
            <div id="branchesTable"></div>
        </div>

        <!-- Inventory Tab -->
        <div id="inventory" class="tab-content">
            <h2>Inventory</h2>
            <div id="inventoryContent"></div>
        </div>

        <!-- Sales Tab -->
        <div id="sales" class="tab-content">
            <h2>Sales</h2>
            <button class="btn btn-primary" onclick="showSaleModal()">+ Record Sale</button>
            <div id="salesTable"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2>Add Product</h2>
            <form onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="productSku" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="productDesc">
                </div>
                <div class="form-group">
                    <label>Unit Price (TZS)</label>
                    <input type="number" id="productPrice" step="0.01">
                </div>
                <button type="submit" class="btn btn-primary">Save Product</button>
                <button type="button" class="btn" onclick="closeModal('productModal')">Cancel</button>
            </form>
        </div>
    </div>

    <div id="branchModal" class="modal">
        <div class="modal-content">
            <h2>Add Branch</h2>
            <form onsubmit="saveBranch(event)">
                <div class="form-group">
                    <label>Branch Name</label>
                    <input type="text" id="branchName" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="branchLocation" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="branchType">
                        <option value="warehouse">Warehouse</option>
                        <option value="sub_branch">Sub-branch</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Branch</button>
                <button type="button" class="btn" onclick="closeModal('branchModal')">Cancel</button>
            </form>
        </div>
    </div>

    <div id="saleModal" class="modal">
        <div class="modal-content">
            <h2>Record Sale</h2>
            <form onsubmit="saveSale(event)">
                <div class="form-group">
                    <label>Product</label>
                    <select id="saleProduct" required></select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="saleQty" required min="1">
                </div>
                <div class="form-group">
                    <label>Price per Unit</label>
                    <input type="number" id="salePrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <select id="saleBranch" required></select>
                </div>
                <button type="submit" class="btn btn-primary">Record Sale</button>
                <button type="button" class="btn" onclick="closeModal('saleModal')">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let data = { products: [], branches: [], sales: [], inventory: {} };

        // API calls
        async function api(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                return await response.json();
            } catch (err) {
                showAlert(`Error: ${err.message}`, 'error');
                console.error(err);
                return null;
            }
        }

        // Load data
        async function loadData() {
            const [products, branches, sales] = await Promise.all([
                api('/products'),
                api('/branches'),
                api('/sales')
            ]);

            if (products) data.products = products;
            if (branches) data.branches = branches;
            if (sales) data.sales = sales;

            updateDashboard();
            updateTables();
        }

        function updateDashboard() {
            document.getElementById('totalProducts').textContent = data.products.length;
            document.getElementById('totalBranches').textContent = data.branches.length;

            const totalStock = data.products.reduce((sum, p) => sum + (p.quantity || 0), 0);
            document.getElementById('totalStock').textContent = totalStock.toLocaleString();

            const todaySales = data.sales
                .filter(s => new Date(s.sale_date).toDateString() === new Date().toDateString())
                .reduce((sum, s) => sum + (s.quantity * s.price), 0);
            document.getElementById('todaysSales').textContent = 'TZS ' + todaySales.toLocaleString();
        }

        function updateTables() {
            // Products
            let html = '<table><thead><tr><th>SKU</th><th>Name</th><th>Description</th><th>Price</th><th>Actions</th></tr></thead><tbody>';
            data.products.forEach(p => {
                html += `<tr>
                    <td>${p.sku}</td>
                    <td>${p.name}</td>
                    <td>${p.description || '-'}</td>
                    <td>TZS ${(p.unit_price || 0).toLocaleString()}</td>
                    <td><button class="btn btn-sm btn-secondary" onclick="editProduct(${p.id})">Edit</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('productsTable').innerHTML = html || '<div class="no-data">No products yet</div>';

            // Branches
            html = '<table><thead><tr><th>Name</th><th>Location</th><th>Type</th><th>Actions</th></tr></thead><tbody>';
            data.branches.forEach(b => {
                html += `<tr>
                    <td>${b.name}</td>
                    <td>${b.location}</td>
                    <td>${b.branch_type}</td>
                    <td><button class="btn btn-sm btn-secondary" onclick="editBranch(${b.id})">Edit</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('branchesTable').innerHTML = html || '<div class="no-data">No branches yet</div>';

            // Sales
            html = '<table><thead><tr><th>Product</th><th>Quantity</th><th>Price</th><th>Branch</th><th>Date</th></tr></thead><tbody>';
            data.sales.slice(-50).reverse().forEach(s => {
                const product = data.products.find(p => p.id === s.product_id);
                const branch = data.branches.find(b => b.id === s.branch_id);
                html += `<tr>
                    <td>${product?.name || 'Unknown'}</td>
                    <td>${s.quantity}</td>
                    <td>TZS ${(s.price || 0).toLocaleString()}</td>
                    <td>${branch?.name || 'Unknown'}</td>
                    <td>${new Date(s.sale_date).toLocaleDateString()}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('salesTable').innerHTML = html || '<div class="no-data">No sales yet</div>';

            // Populate select dropdowns
            const productSelect = document.getElementById('saleProduct');
            productSelect.innerHTML = data.products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

            const branchSelect = document.getElementById('saleBranch');
            branchSelect.innerHTML = data.branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        }

        // Modal functions
        function showProductModal() { document.getElementById('productModal').classList.add('active'); }
        function showBranchModal() { document.getElementById('branchModal').classList.add('active'); }
        function showSaleModal() { document.getElementById('saleModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // Save functions
        async function saveProduct(e) {
            e.preventDefault();
            const product = {
                sku: document.getElementById('productSku').value,
                name: document.getElementById('productName').value,
                description: document.getElementById('productDesc').value,
                unit_price: parseFloat(document.getElementById('productPrice').value) || 0
            };

            const result = await api('/products', {
                method: 'POST',
                body: JSON.stringify(product)
            });

            if (result) {
                showAlert('Product saved!', 'success');
                closeModal('productModal');
                loadData();
                e.target.reset();
            }
        }

        async function saveBranch(e) {
            e.preventDefault();
            const branch = {
                name: document.getElementById('branchName').value,
                location: document.getElementById('branchLocation').value,
                branch_type: document.getElementById('branchType').value
            };

            const result = await api('/branches', {
                method: 'POST',
                body: JSON.stringify(branch)
            });

            if (result) {
                showAlert('Branch saved!', 'success');
                closeModal('branchModal');
                loadData();
                e.target.reset();
            }
        }

        async function saveSale(e) {
            e.preventDefault();
            const sale = {
                product_id: parseInt(document.getElementById('saleProduct').value),
                quantity: parseInt(document.getElementById('saleQty').value),
                price: parseFloat(document.getElementById('salePrice').value),
                branch_id: parseInt(document.getElementById('saleBranch').value),
                sale_date: new Date().toISOString()
            };

            const result = await api('/sales', {
                method: 'POST',
                body: JSON.stringify(sale)
            });

            if (result) {
                showAlert('Sale recorded!', 'success');
                closeModal('saleModal');
                loadData();
                e.target.reset();
            }
        }

        function showAlert(msg, type) {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // Close modals on background click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });

        // Initialize
        loadData();
        setInterval(loadData, 5000); // Refresh every 5 seconds
    </script>
</body>
</html>
